syntax = "proto3";

package pricing.v1;

service PricingService {
  rpc QuotePrice (QuotePriceRequest) returns (QuotePriceResponse);
  rpc GetBulkQuote (BulkQuoteRequest) returns (BulkQuoteResponse);
}

message QuotePriceRequest {
  string sku = 1;
  int32 quantity = 2;
  string customer_tier = 3;
}

message QuotePriceResponse {
  string sku = 1;
  int32 quantity = 2;
  double unit_price = 3;
  double total_price = 4;
  string currency = 5;
}

message BulkQuoteRequest {
  string customer_tier = 1;
  repeated QuoteLine lines = 2;
}

message QuoteLine {
  string sku = 1;
  int32 quantity = 2;
}

message BulkQuoteResponse {
  repeated QuotePriceResponse quotes = 1;
  double grand_total = 2;
  string currency = 3;
}
