version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/pricingApi"
    runOptions:
      openapi:
        host: localhost
        port: 9000
dependencies:
  services: []
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
  services:
    pricingApi:
      description: "Pricing API"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "pricing.yaml"
