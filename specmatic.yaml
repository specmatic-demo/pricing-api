version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/pricingService"
    runOptions:
      openapi:
        host: localhost
        port: 9000
dependencies:
  services: []
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
  services:
    pricingService:
      description: "Pricing Service"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "pricing.yaml"
