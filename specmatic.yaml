version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/pricingService"
    runOptions:
      protobuf:
        host: localhost
        port: 9000
        protocVersion: "3.23.4"
dependencies:
  services: []
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
  services:
    pricingService:
      description: "Pricing Service"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "pricing.proto"
